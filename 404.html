<style>
:root{--night:#0B0D0F;--edge:rgba(226,234,236,.12);--snow:#EDF1F1;--mist:#8F9AA0;--tungsten:#F4A62A;--rec:#E5483C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--night);color:var(--snow);font:400 1rem/1.6 "Manrope",system-ui,sans-serif;padding:32px 16px}
main{width:min(560px,100%)}
.rec{font:500 .75rem "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--rec);display:flex;align-items:center;gap:8px}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:b 1.2s steps(2) infinite}
@keyframes b{50%{opacity:0}}
h1{font:600 clamp(2.2rem,8vw,3.4rem)/1.05 "Unbounded",sans-serif;margin:14px 0 18px}
p{color:var(--mist);margin:0 0 28px}
nav{display:grid;gap:8px}
nav a{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--edge);border-radius:12px;padding:14px 18px;text-decoration:none;color:var(--snow)}
nav a:hover,nav a:focus-visible{border-color:var(--tungsten);color:var(--tungsten)}
nav span{font:500 .75rem "JetBrains Mono",monospace;color:var(--mist)}
nav a[lang=ar]{font-family:"IBM Plex Sans Arabic",sans-serif}
@media (prefers-reduced-motion:reduce){.rec i{animation:none}}
</style>
</head>

    <a href="/abmedia-site/ar/" lang="ar" hreflang="ar" dir="rtl">الصفحة الرئيسية <span>AR</span></a>
